name: Build Kivy APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            zip unzip build-essential git \
            python3-dev python3-pip python3-setuptools \
            ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            zlib1g-dev autoconf automake libtool cmake pkg-config \
            libffi-dev libssl-dev

      - name: Install build tools
        run: |
          pip install --upgrade cython virtualenv buildozer

      - name: 自动静默接受 Android SDK 许可协议
        run: |
          yes | $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --licenses || true

      # ========== 关键修改：使用 master 分支并升级 libffi ==========
      - name: Prepare patched python-for-android (master branch)
        run: |
          git clone --depth 1 --branch master https://github.com/kivy/python-for-android.git p4a
          RECIPE_FILE="p4a/pythonforandroid/recipes/libffi/__init__.py"
          sed -i 's/version = "3.2.1"/version = "3.4.4"/' "$RECIPE_FILE"
          sed -i 's|url = ".*"|url = "https://github.com/libffi/libffi/releases/download/v3.4.4/libffi-3.4.4.tar.gz"|' "$RECIPE_FILE"
      # ===========================================================

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Omphalos-APK
          path: bin/*.apk
