name: Build Kivy APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            zip unzip build-essential git \
            python3-dev python3-pip python3-setuptools \
            ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            zlib1g-dev autoconf automake libtool cmake pkg-config \
            libffi-dev libssl-dev libltdl-dev openjdk-17-jdk

      - name: Cache global buildozer SDK NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer-global
          key: ${{ runner.os }}-bz-global-v3

      - name: Install build tools
        run: |
          pip install --upgrade cython virtualenv buildozer
          echo "PATH=$HOME/.local/bin:$PATH" >> $GITHUB_ENV

      - name: Prepare patched p4a (stable)
        run: |
          rm -rf ~/.buildozer/android/packages/libffi*
          rm -rf ~/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/build/other_builds/libffi
          rm -rf ./p4a

          git clone --depth 1 --branch release-2023.1 https://github.com/kivy/python-for-android.git p4a
          pip install -e ./p4a

          RECIPE="p4a/pythonforandroid/recipes/libffi/__init__.py"
          python3 -c "
          import re
          with open('$RECIPE', 'r') as f:
              content = f.read()
          content = re.sub(r\"version\\s*=\\s*['\\\"]v?3\\.[0-9]+\\.[0-9]+['\\\"]\", 'version = \"3.4.4\"', content)
          content = re.sub(r\"url\\s*=\\s*['\\\"][^'\\\"]+['\\\"]\", 'url = \"https://github.com/libffi/libffi/releases/download/v3.4.4/libffi-3.4.4.tar.gz\"', content)
          with open('$RECIPE', 'w') as f:
              f.write(content)
          "

      - name: Configure buildozer.spec
        run: |
          sed -i 's/^requirements = .*/requirements = python3,kivy/' buildozer.spec
          sed -i 's/^android.archs = .*/android.archs = arm64-v8a/' buildozer.spec
          echo "android.ndk_parallel_build_jobs = 2" >> buildozer.spec
          echo "source.include_exts = py,png,jpg,kv,atlas,ttf,ttc" >> buildozer.spec

      - name: Build APK
        env:
          PKG_CONFIG_PATH: ""
          PKG_CONFIG_LIBDIR: ""
        run: |
          buildozer android clean
          buildozer android debug

      - name: Check bin directory
        run: ls -la bin/ || echo "bin/ is empty or doesn't exist"

      - name: Upload APK
        if: success() && hashFiles('bin/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Omphalos-APK
          path: bin/*.apk
