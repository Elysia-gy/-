name: Build Kivy APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            zip unzip build-essential git \
            python3-dev python3-pip python3-setuptools \
            ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            zlib1g-dev autoconf automake libtool cmake pkg-config \
            libffi-dev libssl-dev

      - name: Install build tools
        run: |
          pip install --upgrade cython virtualenv buildozer

      - name: 自动静默接受 Android SDK 许可协议
        run: |
          yes | $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --licenses || true

      # =============================================================
      # 修补 python-for-android 的 libffi recipe 到 3.4.4
      # =============================================================
      - name: Prepare patched python-for-android (master branch)
        run: |
          git clone --depth 1 --branch master https://github.com/kivy/python-for-android.git p4a
          RECIPE_FILE="p4a/pythonforandroid/recipes/libffi/__init__.py"

          # 显示原始内容（调试用）
          echo "====== Original recipe ======"
          cat "$RECIPE_FILE"
          echo "=============================="

          # 使用 Python 进行精确替换（兼容单/双引号）
          python3 -c "
          import re
          with open('$RECIPE_FILE', 'r') as f:
              content = f.read()
          # 替换版本号（匹配 '3.2.1' 或 "3.2.1"）
          content = re.sub(r\"version\\s*=\\s*['\\\"]3\\.[0-9]+\\.[0-9]+['\\\"]\", 'version = \"3.4.4\"', content)
          # 替换第一个 url（匹配任意引号包裹的地址）
          content = re.sub(r\"url\\s*=\\s*['\\\"].*?['\\\"]\", 'url = \"https://github.com/libffi/libffi/releases/download/v3.4.4/libffi-3.4.4.tar.gz\"', content, count=1)
          with open('$RECIPE_FILE', 'w') as f:
              f.write(content)
          "

          # 显示修改后的内容，并验证版本是否为 3.4.4
          echo "====== Modified recipe ======"
          cat "$RECIPE_FILE"
          echo "=============================="

          # 强制验证：如果版本不是 3.4.4，则失败
          if ! grep -q 'version = "3.4.4"' "$RECIPE_FILE"; then
            echo "ERROR: libffi version is NOT 3.4.4!"
            exit 1
          fi
          echo "✅ libffi recipe successfully patched to 3.4.4"
      # =============================================================

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Omphalos-APK
          path: bin/*.apk
