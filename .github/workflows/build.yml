name: Build Kivy APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            zip unzip build-essential git \
            python3-dev python3-pip python3-setuptools \
            ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            zlib1g-dev autoconf automake libtool cmake pkg-config \
            libffi-dev libssl-dev libltdl-dev

      - name: Install build tools
        run: |
          pip install --upgrade cython virtualenv buildozer

      - name: 自动静默接受 Android SDK 许可协议
        run: |
          yes | $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --licenses || true

      - name: Prepare patched p4a and clear libffi cache
        run: |
          # 删除缓存
          rm -rf ~/.buildozer/android/packages/libffi*
          rm -rf ~/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/build/other_builds/libffi

          git clone --depth 1 --branch master https://github.com/kivy/python-for-android.git p4a

          RECIPE="p4a/pythonforandroid/recipes/libffi/__init__.py"
          echo "====== 原始内容 ======"
          cat "$RECIPE"

          python3 -c "
          import re
          with open('$RECIPE', 'r') as f:
              content = f.read()
          # 替换版本号（匹配 v3.4.2 或 3.2.1 等）
          content = re.sub(r\"version\\s*=\\s*['\\\"]v?3\\.[0-9]+\\.[0-9]+['\\\"]\", 'version = \"3.4.4\"', content)
          # 替换 URL
          content = re.sub(r\"url\\s*=\\s*['\\\"][^'\\\"]+['\\\"]\", 'url = \"https://github.com/libffi/libffi/releases/download/v3.4.4/libffi-3.4.4.tar.gz\"', content)
          with open('$RECIPE', 'w') as f:
              f.write(content)
          "

          echo "====== 修改后内容 ======"
          cat "$RECIPE"

          if grep -q 'version = "3.4.4"' "$RECIPE" && grep -q 'libffi-3.4.4.tar.gz' "$RECIPE"; then
            echo "✅ libffi recipe 已成功更新到 3.4.4"
          else
            echo "❌ 版本或 URL 替换失败"
            exit 1
          fi

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Omphalos-APK
          path: bin/*.apk
